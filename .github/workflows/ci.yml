name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded runs of the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # allow lighthouse-ci to comment on PRs
  checks: write

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Backend: pytest matrix (Python 3.11 / 3.12) + coverage report upload
  # ───────────────────────────────────────────────────────────────────────
  backend:
    name: backend / pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      PAYMENT_MODE: mock
      DATABASE_URL: "sqlite:///:memory:"
      JWT_SECRET: ci-test-secret
      OAUTH_STATE_SECRET: ci-test-state
      FRONTEND_URL: http://localhost:3000
      API_PUBLIC_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system libs for WeasyPrint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            libcairo2 libgdk-pixbuf-2.0-0

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: pytest with coverage
        run: pytest -q --cov-report=xml --cov-report=term

      - name: Upload coverage report
        if: always() && matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ matrix.python }}
          path: |
            backend/.coverage
            backend/coverage.xml
          retention-days: 14

  # ───────────────────────────────────────────────────────────────────────
  # Frontend: lint + Vitest + production build
  # ───────────────────────────────────────────────────────────────────────
  frontend:
    name: frontend / lint + vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:1
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
        run: npm run build

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/.next
            frontend/public
          retention-days: 1

  # ───────────────────────────────────────────────────────────────────────
  # Frontend e2e: smoke + axe a11y (Playwright; webserver self-spawned)
  # ───────────────────────────────────────────────────────────────────────
  e2e:
    name: e2e / Playwright (smoke + a11y)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install OS deps for cached browsers
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run e2e (smoke + a11y)
        env:
          CI: "true"
        run: npm run test:e2e

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────
  # Lighthouse CI (a11y/perf/SEO) — runs on PRs and posts a comment
  # ───────────────────────────────────────────────────────────────────────
  lighthouse:
    name: lighthouse / lhci
    runs-on: ubuntu-latest
    needs: frontend
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install OS deps for cached browsers
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Lighthouse CI (autorun + assert + upload)
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:1
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
          # Anonymous PR comments — no token wiring required.
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx lhci autorun --config=./lighthouserc.cjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: frontend/.lighthouseci
          retention-days: 14
