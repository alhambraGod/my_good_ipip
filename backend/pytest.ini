[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Coverage opts run by default; pass --no-cov to disable in tight inner loops.
# Coverage gate is 80% — covers all pure-logic code while accepting that
# Razorpay/Cashfree/PayU HTTP paths need sandbox creds (covered manually
# via backend/scripts/razorpay_sandbox_smoke.py + the ops RUNBOOK).
addopts = --cov --cov-report=term-missing --cov-fail-under=80
