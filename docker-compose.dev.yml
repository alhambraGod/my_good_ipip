# MindPrism — dev environment.
# Includes a containerised MySQL so contributors don't need a host install.
# Logs are persisted on the host at /var/MindPrism/dev/logs (via bind mount).
#
# Bring up:    bash deploy/start_docker.sh dev
# Bring down:  bash deploy/stop_docker.sh dev

name: mindprism-dev

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mindprism_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mindprism_dev}
      MYSQL_USER: ${MYSQL_USER:-mindprism}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mindprism_dev}
    ports:
      - "127.0.0.1:3307:3306"   # exposed locally for inspection only
    volumes:
      - mindprism-dev-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-mindprism_dev}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [mindprism]

  backend:
    image: mindprism-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      APP_ENV: dev
      DATABASE_URL: "mysql+pymysql://${MYSQL_USER:-mindprism}:${MYSQL_PASSWORD:-mindprism_dev}@mysql:3306/${MYSQL_DATABASE:-mindprism_dev}?charset=utf8mb4"
      PAYMENT_MODE: "${PAYMENT_MODE:-mock}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
      API_PUBLIC_URL: "${API_PUBLIC_URL:-http://localhost:3001}"
      JWT_SECRET: "${JWT_SECRET:-dev-jwt-secret}"
      OAUTH_STATE_SECRET: "${OAUTH_STATE_SECRET:-dev-oauth-state}"
      LOG_ROOT: /var/MindPrism
      LOG_RETENTION_DAYS: "30"
      GUNICORN_WORKERS: "2"
    expose: ["3001"]
    ports:
      - "127.0.0.1:3001:3001"   # local debugging; nginx proxies in prod
    volumes:
      - /var/MindPrism/dev:/var/MindPrism/dev
    networks: [mindprism]

  frontend:
    image: mindprism-frontend:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:3001}"
        NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}"
    restart: unless-stopped
    depends_on:
      backend: { condition: service_started }
    expose: ["3000"]
    ports:
      - "127.0.0.1:3000:3000"
    networks: [mindprism]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [frontend, backend]
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/mindprism.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/MindPrism/dev/logs/nginx:/var/log/nginx
    networks: [mindprism]

volumes:
  mindprism-dev-mysql:

networks:
  mindprism:
    name: mindprism-dev
