# MindPrism — dev site config
# Single-host topology: nginx → frontend (Next.js) → backend (FastAPI)
# Mounted into the nginx container by docker-compose.dev.yml.

# ─────────────────────────────────────────────────────────────────────────
# Upstream pools.
#
# In dev there's just one of each. To scale-out without docker:
#   1) start more backend / frontend containers on the same docker network
#   2) add `server backend2:3001;` lines below
#   3) `nginx -s reload`
#
# In docker-compose:
#   docker compose -f docker-compose.dev.yml up -d --scale backend=2 --scale frontend=2
# Compose's built-in DNS load-balances `backend:3001` round-robin without
# needing this file to change. The explicit `server` lines below are kept
# for the "manual scale-out" path documented in DEPLOYMENT_digitalocean.md.
# ─────────────────────────────────────────────────────────────────────────

upstream mindprism_backend {
    least_conn;
    server backend:3001 max_fails=3 fail_timeout=10s;
    # ⤵ uncomment when you scale backends on additional hosts/containers:
    # server backend2:3001 max_fails=3 fail_timeout=10s;
    # server backend3:3001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream mindprism_frontend {
    least_conn;
    server frontend:3000 max_fails=3 fail_timeout=10s;
    # ⤵ uncomment when you scale frontends:
    # server frontend2:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name  _;

    # Security baseline (relaxed in dev; prod tightens these).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Connection limits.
    limit_conn conn_zone 30;

    # ─────────────────────────────────────────────────────────────────
    # API → backend
    # ─────────────────────────────────────────────────────────────────
    location ~ ^/api/(v3/payment|v3/auth|auth)/ {
        # Tighter limit on payment + auth endpoints.
        limit_req zone=pay_zone burst=10 nodelay;
        proxy_pass http://mindprism_backend;
        include    /etc/nginx/conf.d/_proxy_common.inc;
    }

    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_pass http://mindprism_backend;
        include    /etc/nginx/conf.d/_proxy_common.inc;
    }

    # /docs (FastAPI Swagger UI) only available in dev.
    location ~ ^/(docs|openapi.json|redoc) {
        proxy_pass http://mindprism_backend;
        include    /etc/nginx/conf.d/_proxy_common.inc;
    }

    # Short-link service.
    location ~ ^/s/[^/]+$ {
        proxy_pass http://mindprism_backend;
        include    /etc/nginx/conf.d/_proxy_common.inc;
    }

    # ─────────────────────────────────────────────────────────────────
    # Next.js dynamic OG images — cached at the edge for 5 min.
    # ─────────────────────────────────────────────────────────────────
    location ~ ^/api/og/ {
        proxy_cache og_zone;
        proxy_cache_valid 200 5m;
        proxy_cache_lock on;
        proxy_pass http://mindprism_frontend;
        include    /etc/nginx/conf.d/_proxy_common.inc;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # ─────────────────────────────────────────────────────────────────
    # Static assets / Next.js output → frontend; cache aggressively.
    # ─────────────────────────────────────────────────────────────────
    location ~* ^/(_next/static|_next/image|favicon\.ico|robots\.txt|sitemap\.xml) {
        proxy_pass http://mindprism_frontend;
        include    /etc/nginx/conf.d/_proxy_common.inc;
        proxy_cache static_zone;
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # ─────────────────────────────────────────────────────────────────
    # Default: all other paths → frontend (Next.js handles routing).
    # ─────────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://mindprism_frontend;
        include    /etc/nginx/conf.d/_proxy_common.inc;
    }
}
