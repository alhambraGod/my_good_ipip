# MindPrism — prod site config
# HTTPS via Let's Encrypt; HTTP → HTTPS redirect; rate-limit + cache enabled.
# Mounted into the nginx container by docker-compose.prod.yml.
#
# Adapt `server_name` and the certificate paths before going live.
# Use `bash deploy/install_letsencrypt.sh DOMAIN` to bootstrap certbot.

# ─────────────────────────────────────────────────────────────────────────
# Upstream pools.
#
# Single-host (initial $20/month tier):
#   single backend container, single frontend container.
#
# Multi-container scale-out (1 host):
#   docker compose -f docker-compose.prod.yml up -d --scale backend=3 --scale frontend=2
#   compose's DNS resolves `backend:3001` round-robin to all replicas.
#
# Multi-host scale-out (10x growth):
#   spin up additional droplets running ONLY the backend/frontend containers
#   (no nginx), then add their private IPs as `server` lines below and
#   `nginx -s reload`. Use Tailscale or DigitalOcean VPC for the private mesh.
# ─────────────────────────────────────────────────────────────────────────

upstream mindprism_backend {
    least_conn;
    server backend:3001 max_fails=3 fail_timeout=15s;

    # ⤵ Multi-host examples — uncomment + edit IPs when scaling out.
    # server 10.114.0.11:3001 max_fails=3 fail_timeout=15s;
    # server 10.114.0.12:3001 max_fails=3 fail_timeout=15s;
    # server 10.114.0.13:3001 backup;        # standby

    keepalive 64;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

upstream mindprism_frontend {
    least_conn;
    server frontend:3000 max_fails=3 fail_timeout=15s;

    # ⤵ Multi-host examples:
    # server 10.114.0.21:3000 max_fails=3 fail_timeout=15s;
    # server 10.114.0.22:3000 max_fails=3 fail_timeout=15s;

    keepalive 64;
    keepalive_timeout 60s;
}

# ── HTTP → HTTPS redirect (also serves ACME challenges) ────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt webroot challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS server ──────────────────────────────────────────────────
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;     # ⚠️ change to your real domain — e.g. www.mindprism.in

    # ── TLS ────────────────────────────────────────────────────────────
    # Let's Encrypt cert paths (provisioned by certbot).
    ssl_certificate     /etc/letsencrypt/live/mindprism.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mindprism.in/privkey.pem;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Security headers ───────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "interest-cohort=(), microphone=(), camera=(), geolocation=()" always;
    # CSP: tightened to allow Razorpay checkout + axe a11y is unaffected.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com https://www.google-analytics.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; font-src 'self' data: https://fonts.gstatic.com" always;

    # Connection cap.
    limit_conn conn_zone 50;

    # ── Razorpay webhook (no rate limit, signed payload) ───────────────
    location = /api/v3/payment/webhook/razorpay {
        proxy_pass http://mindprism_backend;
        include    /etc/nginx/conf.d/_proxy_common.inc;
        # Don't apply user-IP rate limits — webhooks come from a fixed source.
    }

    # ── Payment + auth endpoints (tighter limit) ───────────────────────
    location ~ ^/api/(v3/payment|v3/auth|auth)/ {
        limit_req zone=pay_zone burst=10 nodelay;
        proxy_pass http://mindprism_backend;
        include    /etc/nginx/conf.d/_proxy_common.inc;
    }

    # ── General API ────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_pass http://mindprism_backend;
        include    /etc/nginx/conf.d/_proxy_common.inc;
    }

    # ── Short-link service ─────────────────────────────────────────────
    location ~ ^/s/[^/]+$ {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_pass http://mindprism_backend;
        include    /etc/nginx/conf.d/_proxy_common.inc;
    }

    # ── OG images (5-min edge cache) ───────────────────────────────────
    location ~ ^/api/og/ {
        proxy_cache og_zone;
        proxy_cache_valid 200 5m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_pass http://mindprism_frontend;
        include    /etc/nginx/conf.d/_proxy_common.inc;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # ── Static assets (immutable, 1-year browser cache) ───────────────
    location ~* ^/(_next/static|_next/image|favicon\.ico|robots\.txt|sitemap\.xml) {
        proxy_pass http://mindprism_frontend;
        include    /etc/nginx/conf.d/_proxy_common.inc;
        proxy_cache static_zone;
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # ── Block /docs and /redoc in prod (FastAPI swagger). ──────────────
    location ~ ^/(docs|openapi.json|redoc) {
        return 404;
    }

    # ── Default: → frontend ────────────────────────────────────────────
    location / {
        proxy_pass http://mindprism_frontend;
        include    /etc/nginx/conf.d/_proxy_common.inc;
    }
}
