# MindPrism — main nginx.conf
# Reusable across dev / prod; site-specific routing lives in conf.d/*.conf.

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  10240;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time ut=$upstream_response_time '
                      'uct=$upstream_connect_time uht=$upstream_header_time';
    access_log  /var/log/nginx/access.log main buffer=32k flush=5s;

    # ── Performance ────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 4096;
    server_names_hash_bucket_size 128;
    client_max_body_size 8m;          # PDF + payload uploads
    client_body_timeout  20s;
    client_header_timeout 20s;
    send_timeout         30s;
    reset_timedout_connection on;

    # ── Compression ────────────────────────────────────────────────────
    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml+rss application/atom+xml image/svg+xml application/wasm
        application/manifest+json;

    # ── Security headers (set per-server too; defaults here for safety) ─
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Rate limiting (cheap shared zones) ─────────────────────────────
    # Hot path: every /api/v3/ request — coarse limit (per IP).
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;
    # Payment endpoints: intentionally tighter to thwart card-testing.
    limit_req_zone $binary_remote_addr zone=pay_zone:10m rate=5r/s;
    # Connection cap to short-circuit slowloris.
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    # ── Caching (light, just for static + ISR-cacheable surfaces) ──────
    proxy_cache_path /var/cache/nginx/static
        levels=1:2 keys_zone=static_zone:50m max_size=500m inactive=1d use_temp_path=off;
    proxy_cache_path /var/cache/nginx/og
        levels=1:2 keys_zone=og_zone:20m max_size=200m inactive=7d use_temp_path=off;

    # ── Site config ─────────────────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
